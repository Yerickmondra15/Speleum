name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/speleum_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/speleum_ci?schema=public
      SESSION_SECRET: ci-session-secret-not-used-outside-this-job
      AUTH_CODE_SECRET: ci-auth-code-secret-not-used-outside-this-job
      SOCKET_AUTH_SECRET: ci-socket-secret-not-used-outside-this-job
      MULTIPLAYER_RESULT_SECRET: ci-results-secret-not-used-outside-this-job
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4001
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_DELIVERY_MODE: demo
      ALLOW_PUBLIC_DEMO_AUTH: "true"
      AUTH_CODE_EXPIRATION_MINUTES: "10"
      AUTH_CODE_MAX_ATTEMPTS: "5"
      AUTH_MAX_RESENDS: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
